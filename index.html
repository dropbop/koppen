    <!-- Preload critical app data so the browser fetches in parallel with the JS bundle.
         Only the JSON manifests are preloaded: COGs are fetched via HTTP byte-range
         requests by OpenLayers' GeoTIFF source, and `<link rel="preload" as="fetch">`
         would force a full-file download that breaks the range-request handshake.
         Paths use %BASE_URL% so BASE_PATH project-page builds resolve correctly. -->
    <link
      rel="preload"
      as="fetch"
      href="%BASE_URL%data/manifest.json"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      as="fetch"
      href="%BASE_URL%data/zones.json"
      crossorigin="anonymous"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Mono:wght@500;600&display=swap"
    />

  <body>
